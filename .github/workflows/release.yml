name: Create Release
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: ./.github/scripts/release_restore-dependencies.sh

      - name: Build
        env:
          VERSION: ${{ vars.MAJOR }}.${{ vars.MINOR }}.${{ github.run_number }}
        run: ./.github/scripts/release_build.sh

      - name: Test
        run: ./.github/scripts/release_test.sh

      - name: Pack
        env:
          VERSION: ${{ vars.MAJOR }}.${{ vars.MINOR }}.${{ github.run_number }}
        run: ./.github/scripts/release_pack.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/*.nupkg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StatelessMermaid.nupkg
          path: out/*.nupkg

      - name: Push to NuGet.org
        env:
          NUGET_KEY: ${{ secrets.NUGET_KEY }}
        run: ./.github/scripts/release_push-to-nuget.sh

      - name: Generate Release Notes
        env:
          VERSION: ${{ vars.MAJOR }}.${{ vars.MINOR }}.${{ github.run_number }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: ./.github/scripts/release_generate-release-notes.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ vars.MAJOR }}.${{ vars.MINOR }}.${{ github.run_number }}
          name: Release v${{ vars.MAJOR }}.${{ vars.MINOR }}.${{ github.run_number }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          files: out/*.nupkg
