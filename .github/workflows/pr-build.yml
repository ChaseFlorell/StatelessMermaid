name: PR Build

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger trx

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./TestResults/**/coverage.cobertura.xml
          fail_ci_if_error: true
          flags: unittests

      - name: Parse results
        id: results
        if: always()
        run: |
          TRX=$(find ./TestResults -name "*.trx" | head -1)
          PASSED=$(grep -oP 'passed="\K[0-9]+' "$TRX" | head -1)
          FAILED=$(grep -oP 'failed="\K[0-9]+' "$TRX" | head -1)
          TOTAL=$(grep -oP 'total="\K[0-9]+' "$TRX" | head -1)
          XML=$(find ./TestResults -name "coverage.cobertura.xml" | head -1)
          LINE_RATE=$(grep -oP 'line-rate="\K[0-9.]+' "$XML" | head -1)
          COVERAGE=$(awk "BEGIN { printf \"%.1f\", $LINE_RATE * 100 }")
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Post PR comment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const passed  = Number('${{ steps.results.outputs.passed }}');
            const failed  = Number('${{ steps.results.outputs.failed }}');
            const total   = Number('${{ steps.results.outputs.total }}');
            const coverage = '${{ steps.results.outputs.coverage }}';

            const testStatus = failed === 0 ? '✅ Passed' : '❌ Failed';
            const marker = '<!-- ci-test-results -->';
            const body = [
              marker,
              '| Tests | Coverage |',
              '|---|---|',
              `| ${testStatus} ${passed}/${total} | ${coverage}% |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
